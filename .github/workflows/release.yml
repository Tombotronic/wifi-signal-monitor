# Pushing a tag like v1.5.0 builds the firmware and publishes it as a
# GitHub release. The tag must match FIRMWARE_VERSION in version.h and
# have a section in CHANGELOG.md (that section becomes the release notes).
# Run it by hand (Actions -> Release -> Run workflow) to only test the build.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # create the release

# Everything is pinned (runner, CLI, core, libraries), so a release builds
# the same way every time.
env:
  CLI_VERSION: 1.5.1
  FQBN: esp32:esp32:m5stack_cardputer:CDCOnBoot=default,FlashSize=8M,PartitionScheme=default_8MB
  CORE: esp32:esp32@3.2.0
  LIBS: M5Cardputer@1.1.1 M5Unified@0.2.23 M5GFX@0.2.30
  SKETCH: wifi_signal_monitor

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches FIRMWARE_VERSION and CHANGELOG.md
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^#define FIRMWARE_VERSION "\(.*\)"$/\1/p' "$SKETCH/version.h")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match FIRMWARE_VERSION $version in version.h"
            exit 1
          fi
          # This version's section: from "## vX.Y.Z" up to the next "## ".
          awk -v tag="$GITHUB_REF_NAME" '/^## /{f = ($2 == tag); next} f' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Install arduino-cli, core and libraries
        run: |
          mkdir -p "$HOME/.local/bin"
          # The script from the same tag, not master: it runs with a token that can publish.
          curl -fsSL "https://raw.githubusercontent.com/arduino/arduino-cli/v$CLI_VERSION/install.sh" \
            | BINDIR="$HOME/.local/bin" sh -s "$CLI_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          arduino-cli version
          arduino-cli core update-index
          arduino-cli core install "$CORE"
          arduino-cli lib install $LIBS

      - name: Build
        run: arduino-cli compile --fqbn "$FQBN" --output-dir build "$SKETCH"

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin="wifi-signal-monitor-$GITHUB_REF_NAME.bin"
          cp "build/$SKETCH.ino.merged.bin" "$bin"
          { cat changes.md; echo; sed "s/VERSION/$GITHUB_REF_NAME/g" .github/release-notes.md; } > notes.md
          gh release create "$GITHUB_REF_NAME" "$bin" --title "$GITHUB_REF_NAME" --notes-file notes.md
